<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="bantLo - Expense Sharing App" />
    <title>bantLo</title>
    <!-- Basic PWA Manifest link (You can create manifest.json later) -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
  </head>
  <body class="bg-black text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // The service worker caches the app shell, which is the whole point in
      // production and actively harmful in development: reloads serve a mix of
      // cached and fresh assets, so a change appears to land intermittently or
      // to regress. Skip registration on local origins, and tear down any
      // worker already registered there from a previous session.
      (function () {
        if (!('serviceWorker' in navigator)) return;

        var host = location.hostname;
        var isLocal = host === 'localhost'
          || host === '127.0.0.1'
          || /^192\.168\./.test(host)
          || /^10\./.test(host)
          || /^172\.(1[6-9]|2\d|3[01])\./.test(host);

        if (isLocal) {
          navigator.serviceWorker.getRegistrations()
            .then(function (regs) { regs.forEach(function (r) { r.unregister(); }); })
            .catch(function (err) { console.error('SW cleanup failed:', err); });
          return;
        }

        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(function (reg) { console.log('SW Reg Success:', reg.scope); })
            .catch(function (err) { console.error('SW Reg Failure:', err); });
        });
      })();
    </script>
  </body>
</html>
